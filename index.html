<!DOCTYPE html>
<html>
<head>
    <title>NAL App</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            chtml: {
                scale: 1.3 
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Dancing Script', cursive;
        }

        #app-content {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: 700;
            font-size: 1.2rem;
            color: #333;
        }

        #bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-size: cover;
            background-position: center;
            transition: background-image 2s ease-in-out;
        }

        input,
        button,
        select {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 1rem;
        }

        .entry {
            border: 1px solid #ccc;
            margin: 8px 0;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.7);
        }

        .term {
            cursor: pointer;
            color: black;
            font-size: 1.4rem; 
            text-transform: uppercase; /* FORCES ALL CAPS ALWAYS */
        }

        .definition {
            margin-top: 10px;
            color: blue;
            font-size: 1.8rem; 
        }
    </style>
</head>

<body>

<div id="bg-slideshow"></div>

<div id="app-content">

    <h1>NAL App</h1>

    <button onclick="exportData()">Export Data</button>

    <input type="file" onchange="importData(event)">

    <br><br>

    <input id="newSubject" placeholder="Enter new subject">

    <button onclick="addSubject()">Create Subject</button>

    <br><br>

    <select id="subjectSelector" onchange="render()"></select>

    <button onclick="deleteSubject()">Delete Subject</button>

    <div style="margin:15px 0;">
        <input id="term" placeholder="Term">

        <input id="def" placeholder="Explanation or Formula">

        <button onclick="addEntry()">Add Entry</button>
    </div>

    <input
        id="searchBar"
        placeholder="Search terms..."
        oninput="render()"
    >

    <h2 id="currentSubjectTitle"></h2>

    <div id="display"></div>

</div>

<script src="script.js"></script>

</body>
</html>
